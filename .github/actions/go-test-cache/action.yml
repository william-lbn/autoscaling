name: Prepare scoped Go test caches
description: Restore compiler/module caches with explicit source, toolchain and ref isolation
inputs:
  environment:
    required: true
    description: root-readonly or host-integration
outputs:
  key:
    value: ${{ steps.meta.outputs.key }}
    description: Exact source cache key for the explicit always-save step
  paths:
    value: ${{ steps.meta.outputs.paths }}
    description: Only Go compiler and downloaded module caches
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
    description: Whether the exact source cache was restored
runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        CI_CACHE_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "$CI_CACHE_ENVIRONMENT" in root-readonly|host-integration) ;; *) exit 1 ;; esac
        source=$(git rev-parse HEAD)
        [[ "$source" =~ ^[a-f0-9]{40}$ ]]
        version=$(go env GOVERSION)
        [[ "$version" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]
        dependencies=$(sha256sum go.mod go.sum | sha256sum | cut -c1-20)
        # PR merge ref、分支与跨仓调用方各有独立命名空间；不恢复其他 PR 的缓存。
        scope=$(python3 -c 'import hashlib,os; print(hashlib.sha256((os.environ["GITHUB_REPOSITORY"]+"\n"+os.environ["GITHUB_REF"]).encode()).hexdigest()[:20])')
        prefix="autoscaling-go-v3-$RUNNER_OS-$RUNNER_ARCH-$version-$dependencies-$scope-$CI_CACHE_ENVIRONMENT"
        {
          echo "key=$prefix-$source"
          echo "restore-prefix=$prefix-"
          echo 'paths<<GO_CACHE_PATHS'
          go env GOCACHE GOMODCACHE
          echo 'GO_CACHE_PATHS'
        } >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.meta.outputs.paths }}
        key: ${{ steps.meta.outputs.key }}
        restore-keys: ${{ steps.meta.outputs.restore-prefix }}
